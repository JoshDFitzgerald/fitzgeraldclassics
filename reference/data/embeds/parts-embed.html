<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .catalog {
      width: 100%;
      margin: 0 auto;
      padding: 12px 28px 32px;
      background: #000;
    }

    .catalog-title {
      margin: 0 0 28px;
      text-align: center;
      color: #d2aa5d;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 4px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 36px;
      align-items: stretch;
    }

    .card {
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: #000;
    }

    .image-wrap {
      width: 100%;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background: #161616;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .image-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      color: #d2aa5d;
      border: 1px solid #333;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
    }

    .card h3 {
      margin: 16px 0 10px;
      color: #fff;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 20px;
      line-height: 1.18;
    }

    .card p {
      margin: 0 0 18px;
      color: #f2f2f2;
      font-size: 14px;
      line-height: 1.55;
    }

    .button-wrap {
      margin-top: auto;
      padding-top: 4px;
    }

    .ebay-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 140px;
      min-height: 42px;
      padding: 11px 22px;
      background: #d2aa5d;
      color: #000;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
    }

    .ebay-button:hover {
      opacity: 0.9;
    }

    .status {
      grid-column: 1 / -1;
      padding: 30px;
      text-align: center;
      color: #ccc;
    }

    @media (max-width: 800px) {
      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 28px;
      }
    }

    @media (max-width: 560px) {
      .catalog {
        padding-left: 18px;
        padding-right: 18px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .catalog-title {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

  <main class="catalog">
    <h2 class="catalog-title">PARTS CATALOG</h2>

    <div id="partsGrid" class="grid">
      <div class="status">Loading available parts...</div>
    </div>
  </main>

  <script>
    const DATA_URL =
      "https://raw.githubusercontent.com/fitzgeraldrei2021-ctrl/fitzgerald-classics-data/main/vintage-parts.json?v=20261017-1";

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function renderCard(item) {
      const image = item.image
        ? `
          <div class="image-wrap">
            <img
              src="${escapeHtml(item.image)}"
              alt="${escapeHtml(item.name)}"
              loading="lazy"
              onerror="this.parentElement.innerHTML='<div class=&quot;placeholder&quot;>Vintage Part<br>Image Coming Soon</div>'"
            >
          </div>
        `
        : `
          <div class="image-wrap">
            <div class="placeholder">Vintage Part<br>Image Coming Soon</div>
          </div>
        `;

      return `
        <article class="card">
          ${image}

          <h3>${escapeHtml(item.name)}</h3>

          <p>${escapeHtml(item.recommendation)}</p>

          <div class="button-wrap">
            <a
              class="ebay-button"
              href="${escapeHtml(item.ebayUrl)}"
              target="_blank"
              rel="noopener noreferrer sponsored"
            >
              ${escapeHtml(item.cta || "View on eBay")}
            </a>
          </div>
        </article>
      `;
    }

    async function loadParts() {
      const grid = document.getElementById("partsGrid");

      try {
        const response = await fetch(DATA_URL, {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error("Unable to load catalog data.");
        }

        const data = await response.json();

        const items = Array.isArray(data.items)
          ? data.items
              .filter(item => item && item.ebayUrl)
              .sort(
                (a, b) =>
                  Number(b.sortOrder || 0) -
                  Number(a.sortOrder || 0)
              )
          : [];

        if (!items.length) {
          grid.innerHTML =
            '<div class="status">No vintage parts are currently available.</div>';
          return;
        }

        grid.innerHTML = items.map(renderCard).join("");

      } catch (error) {
        console.error(error);

        grid.innerHTML =
          '<div class="status">The parts catalog is temporarily unavailable. Please check back shortly.</div>';
      }
    }

    loadParts();
  </script>

</body>
</html>
