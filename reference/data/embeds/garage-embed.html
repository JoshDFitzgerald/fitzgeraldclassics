<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#0d0d0d;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

.wrap{
  max-width:1200px;
  margin:0 auto;
  padding:24px 20px 30px;
}

.controls{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:18px;
  flex-wrap:wrap;
  margin-bottom:26px;
}

.filter{
  display:flex;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}

label{
  color:#d9ad50;
  font-weight:700;
  font-size:17px;
}

select{
  background:#181818;
  color:#fff;
  border:1px solid #d9ad50;
  padding:12px 14px;
  font-size:16px;
  min-width:280px;
}

.pager{
  display:flex;
  align-items:center;
  gap:12px;
}

.nav,
.amazon{
  background:#d9ad50;
  color:#050505;
  border:0;
  font-weight:700;
  cursor:pointer;
}

.nav{
  padding:11px 18px;
  font-size:15px;
}

.nav:disabled{
  opacity:.4;
  cursor:default;
}

.status{
  min-width:70px;
  text-align:center;
  color:#ddd;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:20px;
}

.card{
  background:#171717;
  border:1px solid #2a2a2a;
  padding:18px;
  display:flex;
  flex-direction:column;
  min-width:0;
}

.category{
  color:#d9ad50;
  text-transform:uppercase;
  letter-spacing:1.4px;
  font-size:12px;
  font-weight:700;
  text-align:center;
  margin-bottom:10px;
}

h3{
  font-family:Georgia,"Times New Roman",serif;
  text-align:center;
  font-size:22px;
  line-height:1.08;
  margin:0 0 16px;
  overflow-wrap:anywhere;
}

.imagebox{
  background:#fff;
  width:100%;
  aspect-ratio:1.3/1;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  margin-bottom:16px;
}

.imagebox img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.image-fallback{
  display:none;
  width:100%;
  height:100%;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:30px;
  color:#666;
  background:#fff;
  font-size:18px;
  font-weight:700;
}

.desc{
  text-align:center;
  font-size:14px;
  line-height:1.5;
  margin:0 0 18px;
  flex:1;
}

.amazon{
  width:100%;
  padding:14px 12px;
  font-size:16px;
}

.nav:hover,
.amazon:hover{
  background:#efc767;
}

.disclosure{
  margin-top:24px;
  color:#bdbdbd;
  font-size:12px;
  line-height:1.5;
  text-align:center;
}

@media(max-width:850px){
  .grid{
    grid-template-columns:1fr;
  }

  .controls{
    align-items:flex-start;
  }
}

@media(max-width:560px){
  .wrap{
    padding:16px 12px 24px;
  }

  .filter{
    width:100%;
  }

  select{
    width:100%;
    min-width:100%;
  }
}
</style>
</head>

const PER_PAGE=3;

let category="All";
let page=0;

const grid=document.getElementById("grid");
const cat=document.getElementById("cat");
const prev=document.getElementById("prev");
const next=document.getElementById("next");
const status=document.getElementById("status");

function filtered(){
  return products.filter(
    p=>category==="All" || p[1]===category
  );
}

function openAmazon(url){
  window.open(
    url,
    "_blank",
    "noopener,noreferrer"
  );
}

function render(){

  const list=filtered();

  const pages=Math.max(
    1,
    Math.ceil(list.length/PER_PAGE)
  );

  if(page>=pages){
    page=pages-1;
  }

  const shown=list.slice(
    page*PER_PAGE,
    page*PER_PAGE+PER_PAGE
  );

  grid.innerHTML="";

  shown.forEach(p=>{

    const card=document.createElement("div");
    card.className="card";

    card.innerHTML=
      '<div class="category">'+p[1]+'</div>'+
      '<h3>'+p[0]+'</h3>'+
      '<div class="imagebox">'+
      '<img class="product-img" src="'+p[4]+'" alt="'+p[0]+'">'+
      '<div class="image-fallback">Product image temporarily unavailable</div>'+
      '</div>'+
      '<p class="desc">'+p[2]+'</p>'+
      '<button class="amazon">View on Amazon</button>';

    const img=card.querySelector(".product-img");
    const fallback=card.querySelector(".image-fallback");

    img.onerror=()=>{
      img.style.display="none";
      fallback.style.display="flex";
    };

    card
      .querySelector(".amazon")
      .onclick=()=>openAmazon(p[3]);

    grid.appendChild(card);

  });

  status.textContent=
    (page+1)+" of "+pages;

  prev.disabled=
    page===0;

  next.disabled=
    page===pages-1;
}

cat.onchange=()=>{
  category=cat.value;
  page=0;
  render();
};

prev.onclick=()=>{
  if(page>0){
    page--;
    render();
  }
};

next.onclick=()=>{

  const pages=
    Math.ceil(
      filtered().length/PER_PAGE
    );

  if(page<pages-1){
    page++;
    render();
  }
};

render();

</script>
